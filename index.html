<header class="pt-10 px-4 pb-3 bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-500/20 shrink-0">
            <i class="fa-solid fa-gas-pump text-sm"></i>
        </div>
        <div>
            <h1 class="text-base font-bold tracking-tight text-white leading-tight">Fuel Tracker <span class="text-xs px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-semibold">PRO</span></h1>
            <p class="text-[10px] text-slate-400 font-medium">Gestão Inteligente & Métricas</p>
        </div>
    </div>
    
    <!-- Botões de Backup & Exportação Ajustados -->
    <div class="flex items-center gap-1.5 flex-wrap">
        <button onclick="exportJSON()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-400 text-[11px] font-semibold border border-slate-700 transition flex items-center gap-1 shadow" title="Exportar Backup JSON">
            <i class="fa-solid fa-download"></i>
            <span>Backup</span>
        </button>

        <label class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-blue-400 text-[11px] font-semibold border border-slate-700 transition flex items-center gap-1 shadow cursor-pointer" title="Restaurar Backup JSON">
            <i class="fa-solid fa-upload"></i>
            <span>Restaurar</span>
            <input type="file" id="importJsonInput" accept=".json" onchange="importJSON(event)" class="hidden">
        </label>

        <button onclick="exportToExcel()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-emerald-600/20 text-emerald-400 text-[11px] font-semibold border border-slate-700 transition flex items-center gap-1 shadow" title="Exportar Excel">
            <i class="fa-solid fa-file-excel"></i>
            <span>XLS</span>
        </button>

        <button onclick="exportToPDF()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-600/20 text-rose-400 text-[11px] font-semibold border border-slate-700 transition flex items-center gap-1 shadow" title="Exportar PDF">
            <i class="fa-solid fa-file-pdf"></i>
            <span>PDF</span>
        </button>
    </div>
</header>
